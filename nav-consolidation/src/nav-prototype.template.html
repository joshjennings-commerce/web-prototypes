<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commerce Consolidated Nav – Prototypes</title>
<style>
:root{
  --nav-h:64px; --dd-ms:220ms; --ease:cubic-bezier(.2,.7,.2,1);
  --accent:#6058ff; --bc-card:#e8ddff; --fdx-card:#d7ebfb; --line:#e3e3e8; --ink:#1a1a1a; --muted:#666;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f3f3f3;-webkit-font-smoothing:antialiased}
body.no-page main{display:none}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ── Faux browser chrome + sticky header ── */
.sticky{position:sticky;top:0;z-index:50}
.addr{height:36px;background:#e9e9ec;border-bottom:1px solid #d6d6db;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12.5px;color:#444}
.addr button{border:0;background:none;width:26px;height:26px;border-radius:6px;cursor:pointer;color:#555}
.addr button:hover:not(:disabled){background:#dcdce0}
.addr button:disabled{opacity:.35;cursor:default}
.url{flex:1;max-width:720px;height:26px;background:#fff;border-radius:7px;display:flex;align-items:center;padding:0 10px;gap:6px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.url .host{color:#1a1a1a;font-weight:500}
.url .path{color:#555}
.url .lock{font-size:11px;color:#777}
.site{background:#fff;box-shadow:0 1px 0 var(--line);position:relative}

/* ── Bars ── */
.bar{height:var(--nav-h);display:flex;align-items:center;gap:26px;padding:0 32px;background:#fff;position:relative}
.bar + .bar, .pbar-wrap + .bar{border-top:1px solid var(--line)}
/* Dual nav: the Commerce parent bar is a compact strip above the sub-brand bar. */
.bar-top{height:var(--top-h,40px);gap:18px}
.bar-top .logo svg{height:16px}
.bar-top .links{gap:0}
.bar-top .link{font-size:12.5px;padding:4px 8px;gap:4px;border-radius:4px}
.bar-top .link.active::after{left:8px;right:8px;bottom:0}
.bar-top .caret{font-size:7px}
.bar-top .btn{font-size:12px;padding:5px 11px;border-width:1px}
/* Collapsing slides the whole header up under the address bar (transform only), so document height never changes
   and scroll position can't be clamped — that clamp was what made the header bounce near the page bottom. */
.site{transition:transform var(--dd-ms) var(--ease)}
.site.scrolled{transform:translateY(calc(-1 * var(--top-h,40px)))}
.addr{position:relative;z-index:2}
.logo{display:flex;align-items:center;cursor:pointer;flex-shrink:0;line-height:0}
.logo svg{height:24px;width:auto;display:block}
.logo.bc svg{height:30px}
.logo.fdx svg{height:24px}
.links{display:flex;gap:4px;align-items:center}
.link{font-size:15px;padding:8px 11px;border-radius:6px;cursor:pointer;background:none;border:0;display:flex;gap:6px;align-items:center;white-space:nowrap;position:relative}
.link:hover{background:#f3f3f5}
.link.active{background:none}
.link.active::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
.caret{font-size:9px;color:#888;transition:transform var(--dd-ms) var(--ease);display:inline-block}
.link.active .caret{transform:rotate(180deg)}
.spacer{flex:1}
.btn{font-size:14px;font-weight:600;padding:11px 18px;border-radius:var(--btn-r,6px);border:1.5px solid #1a1a1a;background:#1a1a1a;color:#fff;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:#fff;color:#1a1a1a}
.btn:hover{background:#333;border-color:#333}
.btn.ghost:hover{background:#f3f3f3;border-color:#1a1a1a}
.btn .chev{display:none;font-size:15px;line-height:1}
.btn .caret{color:inherit;opacity:.85}
.btn.active .caret{transform:rotate(180deg)}
body.brand-cta .btn.b-fdx:not(.ghost){background:#f2a585;border-color:#f2a585;color:#1a1a1a}
body.brand-cta .btn.b-fdx:not(.ghost):hover{background:#ee9570;border-color:#ee9570}
body.brand-cta .btn.b-fdx .chev{display:inline}
body.brand-cta .btn.b-commerce:not(.ghost){background:var(--accent);border-color:var(--accent)}
body.brand-cta .btn.b-commerce:not(.ghost):hover{filter:brightness(.92)}
.login,.util{font-size:14px;background:none;border:0;cursor:pointer;white-space:nowrap;padding:8px 8px;border-radius:6px}
.util{color:#555;font-size:13px}
.login:hover,.util:hover{background:#f3f3f5}
.right{display:flex;align-items:center;gap:10px}

/* ── Dropdown layer ── */
.dd{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border-bottom:1px solid var(--line);border-top:1px solid #e5e5e5;box-shadow:0 24px 40px -24px rgba(0,0,0,.3);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity var(--dd-ms) var(--ease),transform var(--dd-ms) var(--ease)}
.dd.open{opacity:1;transform:none;pointer-events:auto}
.dd-inner{padding:36px 32px 40px;overflow:hidden}

/* Mega menu primitives (layout modeled on the live BC / Feedonomics menus) */
.mega{display:flex;gap:40px;align-items:stretch;--panel:#f3f4f7;--icon:var(--accent);--cta2:var(--accent);--hl:#eef0ff}
.mega.brand-bc{--icon:#1a1a1a;--cta2:#1a1a1a;--panel:#f3f4f7}
.mega.brand-fdx{--icon:#1f57ff;--cta2:#f2a585;--panel:#eceefc}
.mega.brand-commerce{--panel:color-mix(in srgb,var(--accent) 7%,#fff)}
.col{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:1 1 0;max-width:400px}
.col.wide{flex:2 1 0;max-width:680px}
.col-h{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:500;padding:0 0 10px 8px;margin:0 0 10px;border-bottom:1px solid #e1e1e6}
.brand-fdx .col-h{text-transform:none;letter-spacing:0;font-size:14px;color:#777}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.mi{display:flex;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;align-items:flex-start}
.mi:hover{background:rgba(0,0,0,.04)}
.mi-ic{flex:0 0 20px;height:20px;color:var(--icon);margin-top:2px}
.mi-ic svg{width:20px;height:20px;display:block}
.mi-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.mi-t{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px;line-height:1.3}
.mi-d{font-size:13.5px;color:var(--muted);line-height:1.4}
.mi.hl{background:var(--hl);padding:14px 16px;margin-top:6px}
.mi.hl:hover{background:#e6e9ff}
.ai{width:18px;height:18px;border-radius:50%;background:#e4e7ff;color:#4b50e6;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.ext{font-size:12px;color:#777}
.panel{flex:0 0 320px;background:var(--panel);margin:-36px -32px -40px auto;padding:36px 32px 40px 32px;display:flex;flex-direction:column;gap:28px}
.panel .col{min-width:0}
.promo{background:#fff;border-radius:10px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.promo:hover{box-shadow:0 6px 18px -10px rgba(0,0,0,.3)}
.promo .col-h{border:0;padding:0;margin:0 0 2px}
.promo h5{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.promo p{margin:0;font-size:13.5px;color:#444;line-height:1.5}
.promo .cta{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-top:10px}
.promo .cta i{width:30px;height:30px;border-radius:50%;background:var(--cta2);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.brand-fdx .promo .cta i{color:#1a1a1a}
.mega.compact{gap:24px}
.mega.compact .mi-t{font-size:14.5px}
.mega.compact .mi-d{font-size:12.5px}
.mega.compact .col-h{font-size:11px;padding-bottom:8px;margin-bottom:8px}
.mega.compact .mi.hl{padding:10px 12px}

/* Parent A – Solutions */
.solA{display:grid;grid-template-columns:minmax(300px,32%) minmax(170px,1fr) 2fr;gap:40px}
.solA .col{max-width:none}
.solA .cards{display:flex;flex-direction:column;gap:14px}
.brand-card{border-radius:10px;padding:22px 24px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:10px}
.brand-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px -12px rgba(0,0,0,.35)}
.brand-card.bc{background:var(--bc-card)} .brand-card.fdx{background:var(--fdx-card)}
.brand-card .logo svg{height:24px}
.brand-card .logo.bc svg{height:28px}
.brand-card p{margin:0;font-size:13.5px;line-height:1.5;color:#333}
.brand-card .cta{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-top:2px}
.brand-card .cta i{width:26px;height:26px;border-radius:50%;background:#1a1a1a;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.solA.compact{grid-template-columns:1.1fr .8fr 1.6fr;gap:20px}
.solA.compact .igrid{gap:2px 12px}
.solA.compact .brand-card{padding:16px 18px;gap:6px}
.solA.compact .brand-card p{font-size:12.5px}

/* Parent B – Platforms */
.platB{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.plat{border-radius:10px;padding:26px 28px;cursor:default}
.plat.bc{background:#f3f4f7} .plat.fdx{background:var(--fdx-card)}
body.dark-alt .plat.bc{background:#17171c;color:#fff}
body.dark-alt .plat.bc .pgrid a:hover{background:rgba(255,255,255,.08)}
body.dark-alt .plat.bc p{color:#cfcfd6}
body.dark-alt .plat.bc .col-h{color:#9a9aa6;border-color:#2e2e36}
.plat-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.plat-h .logo svg{height:24px}
.plat-h .go{font-size:14px;font-weight:600}
.plat p{margin:10px 0 0;font-size:13.5px;line-height:1.5;color:#333}
.plat .col-h{margin-top:20px;padding-left:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:0 -8px}
.pgrid a{font-size:15px;padding:9px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.pgrid a:hover{background:rgba(0,0,0,.05)}

/* v2.0 – Get started (CTA dropdown + modal share this block) */
.gs{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin-left:auto}
.gs-h{grid-column:1/-1;font-size:20px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.gs-col{border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.gs-col.bc{background:var(--bc-card)} .gs-col.fdx{background:var(--fdx-card)}
.gs-col .logo svg{height:22px} .gs-col .logo.bc svg{height:26px}
.gs-col p{margin:2px 0 8px;font-size:13px;color:#333;line-height:1.45}
.gs-opt,.gs-sales{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.gs-opt{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gs-opt:hover{box-shadow:0 6px 16px -10px rgba(0,0,0,.35);transform:translateY(-1px)}
.gs-opt b,.gs-sales b{font-size:14.5px;font-weight:600;display:block}
.gs-opt small,.gs-sales small{font-size:12.5px;color:#666;display:block;margin-top:2px}
.gs-opt i,.gs-sales i{width:26px;height:26px;border-radius:50%;background:#1a1a1a;color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;flex-shrink:0}
.gs-sales{grid-column:1/-1;padding:14px 18px;border:1.5px solid var(--line);border-radius:10px}
.gs-sales:hover{border-color:#1a1a1a}
.modal-bg{position:fixed;inset:0;z-index:55;background:rgba(10,10,20,.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity var(--dd-ms) var(--ease)}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:16px;width:min(780px,100%);padding:32px 32px 28px;position:relative;transform:translateY(12px) scale(.98);transition:transform var(--dd-ms) var(--ease);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal-bg.open .modal{transform:none}
.modal-x{position:absolute;top:14px;right:14px;border:0;background:none;font-size:18px;cursor:pointer;width:34px;height:34px;border-radius:50%;color:#555}
.modal-x:hover{background:#f0f0f3}
.modal .gs{max-width:none;margin:0}

/* ── Review mode: flagged items get an amber outline + numbered marker ── */
.rv{outline:2px solid #f59e0b;outline-offset:3px;border-radius:6px;position:relative}
.rv-mark{position:absolute;top:-10px;right:-10px;width:20px;height:20px;border-radius:50%;background:#f59e0b;color:#111;font:700 11px/20px ui-sans-serif,system-ui,sans-serif;text-align:center;cursor:help;z-index:6;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.rv-mark:hover{transform:scale(1.12)}
.rv-pop{position:fixed;z-index:70;width:300px;background:#1a1a1a;color:#eee;border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none}
.rv-pop.show{display:block}
.rv-pop b{display:block;color:#fbbf24;margin-bottom:4px;font-size:12px}
.rv-legend{position:fixed;left:16px;z-index:60;width:400px;max-width:calc(100vw - 90px);background:#111;color:#ddd;border-radius:12px;padding:12px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;max-height:50vh;overflow:auto}
.rv-legend.show{display:block}
.rv-legend h4{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fbbf24;font-weight:600}
.rv-legend ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rv-legend li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.rv-legend li i{flex:0 0 18px;height:18px;border-radius:50%;background:#f59e0b;color:#111;font:700 10.5px/18px ui-sans-serif,system-ui,sans-serif;text-align:center;font-style:normal;margin-top:1px}
.rv-legend li b{color:#fff;font-weight:600}
.rv-legend li span{color:#aaa}

/* ── Sub-brand B (focused nav + parent expander) ── */
.bar-sb{padding-left:0}
.sb-left{flex:1;align-self:stretch;display:flex;align-items:center;gap:22px;position:relative;padding-left:calc(var(--nav-h) + 22px)}
.sb-tile{position:absolute;left:0;top:0;bottom:0;z-index:3;min-width:var(--nav-h);display:flex;align-items:center;gap:8px;padding:0 14px;
  background:#fff;border-right:1px solid var(--line);cursor:pointer;overflow:hidden;white-space:nowrap;transition:min-width var(--dd-ms) var(--ease)}
.sb-tile:hover{background:#fafafa}
/* One full Commerce logo at a fixed size. Collapsed = clipped to the mark (0–42.9 of the 220-unit viewBox); expanded = reveal the wordmark. */
.sb-logo{line-height:0;overflow:hidden;flex:0 0 auto;width:27px;transition:width var(--dd-ms) var(--ease)}
.sb-logo svg{height:26px;width:130px;max-width:none;display:block}
.sb-caret{font-size:10px;transition:transform var(--dd-ms) var(--ease);margin-left:auto;color:#555}
.mode-flyout.expanded .sb-tile{min-width:var(--tile-w,280px)}
.mode-flyout.expanded .sb-logo{width:130px}
.mode-flyout.expanded .sb-caret{transform:rotate(180deg)}

/* The flyout anchors to the top of the bar: the Commerce column starts under the tile, while the second-level
   content panel runs flush to the top of the screen and covers the sub-brand links behind it. */
.fly{position:absolute;top:0;left:0;right:0;display:flex;align-items:stretch;opacity:0;transform:translateY(-6px);pointer-events:none;z-index:4;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.14));transition:opacity var(--dd-ms) var(--ease),transform var(--dd-ms) var(--ease)}
/* Only the column and content panel take pointer events; the empty corner over the tile stays click-through. */
.mode-flyout.expanded .fly{opacity:1;transform:none}
.mode-flyout.expanded .fly-col,.mode-flyout.expanded .fly-content{pointer-events:auto}
.fly-col{width:var(--tile-w,280px);margin-top:var(--nav-h);background:#fff;border:1px solid var(--line);border-top:0;padding:8px;flex-shrink:0}
.fly-item{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:5px;font-size:13.5px;cursor:pointer}
.fly-item:hover{background:#f3f3f3}
.fly-item.active{background:color-mix(in srgb,var(--accent) 14%,#fff)}
.fly-item span{color:#888;font-size:11px}
.fly-link span{font-size:14px}
body.no-fly-arrows .fly-link span{display:none}
.fly-cta{margin-top:8px;padding-top:14px;border-top:1px solid var(--line);border-radius:0 0 5px 5px;font-weight:600;color:var(--accent)}
.fly-cta span{color:var(--accent)}
.fly-content{flex:1;min-width:0;overflow-x:auto;min-height:calc(var(--nav-h) + 240px);background:#fff;border:1px solid var(--line);border-top:0;border-left:0;padding:24px 26px 26px}

.sb-inline{position:absolute;inset:0;z-index:4;background:#fff;display:flex;align-items:center;gap:22px;padding-left:20px;border-right:1px solid var(--line);
  clip-path:inset(0 100% 0 0);transition:clip-path var(--dd-ms) var(--ease);pointer-events:none}
.mode-inline.expanded .sb-inline{clip-path:inset(0 0 0 0);pointer-events:auto}
.sb-collapse{align-self:stretch;width:28px;border:0;border-left:1px solid #ddd;background:#f3f3f3;cursor:pointer;font-size:12px}
.sb-collapse:hover{background:#e8e8e8}

/* ── Page body: blank wireframe ── */
main{max-width:1200px;margin:0 auto;padding:64px 24px 160px;--wf:#dcdce2;--wf-light:#ececf0}
main section,main footer{margin-bottom:72px}
h1{font-size:48px;letter-spacing:-.03em;margin:0 0 22px;line-height:1.05}
.wf-line{height:12px;border-radius:6px;background:var(--wf);margin:0 0 12px}
.wf-img{border:1.5px solid var(--wf);border-radius:8px;background:var(--wf-light) linear-gradient(to top right,transparent calc(50% - .75px),var(--wf) calc(50% - .75px),var(--wf) calc(50% + .75px),transparent calc(50% + .75px)),linear-gradient(to top left,transparent calc(50% - .75px),var(--wf) calc(50% - .75px),var(--wf) calc(50% + .75px),transparent calc(50% + .75px));background-color:var(--wf-light);min-height:240px}
.wf-img.sm{min-height:150px;margin-bottom:18px}
.wf-btns{display:flex;gap:12px;margin-top:22px}
.wf-btns.center{justify-content:center}
.wf-btn{width:132px;height:42px;border-radius:6px;background:#2a2a2e}
.wf-btn.ghost{background:none;border:1.5px solid #2a2a2e}
.wf-hero{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.wf-hero .wf-img{min-height:340px}
.wf-logos{display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
.wf-logo{height:36px;border-radius:6px;background:var(--wf)}
.wf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.wf-card{border:1.5px solid var(--wf);border-radius:10px;padding:20px;background:#fff}
.wf-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.wf-band{border:1.5px solid var(--wf);border-radius:12px;padding:48px 24px;background:#fff;display:flex;flex-direction:column;align-items:center}
.wf-band .wf-line{margin-left:auto;margin-right:auto}
.wf-footer{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;padding-top:40px;border-top:1.5px solid var(--wf)}

/* ── Prototype toolbar ── */
.proto{position:fixed;left:16px;bottom:16px;z-index:60;background:#111;color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:12px;width:400px;max-width:calc(100vw - 90px)}
.proto-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proto-row + .proto-row{margin-top:8px}
.proto-label{color:#888}
.proto-sel{font:inherit;font-size:12px;background:#2a2a2a;color:#fff;border:0;border-radius:8px;padding:5px 8px;cursor:pointer}
.rv-toggle{margin-left:auto;border:1px solid #444;background:none;color:#bbb;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.rv-toggle.on{background:#f59e0b;border-color:#f59e0b;color:#111;font-weight:600}
.seg{display:flex;background:#2a2a2a;border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:#bbb;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.seg button.on{background:#fff;color:#111;font-weight:600}
.proto-cap{margin-top:8px;color:#aaa;line-height:1.45}
.proto-cap b{color:#fff;font-weight:600}

/* ─────────────── Review mode ─────────────── */
const rvpop = document.getElementById('rvpop');
let rvPinned = null;
function applyFlags() {
  document.querySelectorAll('.rv-mark').forEach(m => m.remove());
  document.querySelectorAll('.rv').forEach(el => el.classList.remove('rv'));
  if (!state.review) { hidePop(); return; }
  (FLAGS[state.ver] || []).forEach(f => {
    document.querySelectorAll(f.where).forEach(el => {
      if (el.closest('.rv-legend, .rv-pop')) return;
      el.classList.add('rv');
      el.insertAdjacentHTML('beforeend', `<span class="rv-mark" data-rv="${f.n}" aria-label="Review note ${f.n}">${f.n}</span>`);
    });

}
function showPop(mark) {
  const f = (FLAGS[state.ver] || []).find(x => x.n === +mark.dataset.rv);
  if (!f) return;
  rvpop.innerHTML = `<b>${f.n} · ${esc(f.title)}</b>${esc(f.note)}`;
  rvpop.classList.add('show');
  const r = mark.getBoundingClientRect(), w = 300, h = rvpop.offsetHeight;
  let x = r.right + 10, y = r.top - 8;
  if (x + w > window.innerWidth - 12) x = r.left - w - 10;
  if (y + h > window.innerHeight - 12) y = window.innerHeight - h - 12;

/* ─────────────── Routing ─────────────── */
function titleFor(url, label) {
  if (label && !/^(Overview|Explore|Learn more|Read now|Get my plan)/i.test(label)) return label;
  if (url === '/') return 'Commerce';
  const segs = url.split(/[?#]/)[0].split('/').filter(Boolean);
  if (segs[0] === 'bigcommerce' && segs.length === 1) return 'BigCommerce';
  if (segs[0] === 'feedonomics' && segs.length === 1) return 'Feedonomics';
  return segs[segs.length - 1].replace(/[-_]+/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
}
function navigate(href, label, desc, opts) {
  if (!href) return;
  if (!opts || !opts.noHist) { state.hist.push({ url: state.url, title: state.title, desc: state.desc, brand: state.brand }); state.fwd = []; }
  state.url = href;
  state.brand = /^https?:/.test(href) ? state.brand : brandOf(href);
  state.title = titleFor(href, label);
  state.desc = desc || '';
  state.expanded = false;
  renderAll();
  window.scrollTo(0, 0);
}
function restore(s) { Object.assign(state, s, { expanded: false }); renderAll(); window.scrollTo(0, 0); }

/* ─────────────── Interaction ─────────────── */
let openTimer, closeTimer;
function openMenu(id, trigger) {
  if (state.expanded && V.expandMode === 'flyout') setExpanded(false, true);
  const dd = document.getElementById('dd'), inner = dd.querySelector('.dd-inner');
  state.open = id;
  state.openHover = trigger ? menuHover(trigger) : false;
  inner.innerHTML = menuContent(id, false);
  // Drop the layer directly under the bar that owns the trigger (so top-bar menus overlay the sub-brand bar).
  const bar = trigger ? trigger.closest('.bar') : null;
  dd.style.top = bar ? (bar.offsetTop + bar.offsetHeight) + 'px' : '100%';
  site.querySelectorAll('[data-menu]').forEach(el => el.classList.toggle('active', el === trigger));
  dd.classList.add('open');
}
function closeMenu() {
  state.open = null;
  const dd = document.getElementById('dd');
  if (dd) dd.classList.remove('open');
  site.querySelectorAll('[data-menu].active').forEach(el => el.classList.remove('active'));
}
function setExpanded(x, keepMenu) {
  if (x) sizeTile();
  state.expanded = x;
  const bar = site.querySelector('.bar-sb');
  if (bar) bar.classList.toggle('expanded', x);
  if (!keepMenu) closeMenu();
}
function setFly(id) {
  if (state.fly === id) return;
  state.fly = id;
  const fc = site.querySelector('.fly-content');
  if (fc) fc.innerHTML = menuContent(id, true);
  site.querySelectorAll('[data-fly]').forEach(el => el.classList.toggle('active', el.dataset.fly === id));
}

// Which control governs a given trigger
const menuHover = m => (m.dataset.kind === 'sub' ? V.trigSub : V.trigParent) === 'hover';
const anyHover = () => [V.trigParent, V.trigSub, V.trigTile, V.trigFly].includes('hover');

site.addEventListener('mouseover', e => {
  if (!anyHover()) return;
  clearTimeout(closeTimer);
  const m = e.target.closest('[data-menu]');
  if (m) {
    clearTimeout(openTimer);
    if (!menuHover(m)) return;
    if (state.open === m.dataset.menu) return;
    openTimer = setTimeout(() => openMenu(m.dataset.menu, m), V.hoverDelay); return;
  }
  const t = e.target.closest('[data-tile]');
  if (t) { clearTimeout(openTimer); if (V.trigTile === 'hover' && !state.expanded) openTimer = setTimeout(() => setExpanded(true), V.hoverDelay); return; }
  const f = e.target.closest('[data-fly]');
  if (f) { if (V.trigFly === 'hover') setFly(f.dataset.fly); return; }
  if (e.target.closest('.link, .logo, .right') && !e.target.closest('.dd, .fly, .sb-inline')) {
    clearTimeout(openTimer);
    if (state.open && state.openHover) closeMenu();
  }
});
site.addEventListener('mouseleave', () => {
  clearTimeout(openTimer);
  closeTimer = setTimeout(() => {
    if (state.open && state.openHover) closeMenu();
    if (state.expanded && V.trigTile === 'hover') setExpanded(false, true);
  }, 240);
});
site.addEventListener('mouseenter', () => clearTimeout(closeTimer));

function go(el) { navigate(el.dataset.href, el.dataset.label, el.dataset.desc); }

function toggleMark(mark) {
  if (rvPinned === mark.dataset.rv) { hidePop(); return; }
  showPop(mark); rvPinned = mark.dataset.rv;
}

site.addEventListener('click', e => {
  e.stopPropagation(); // header re-renders on navigate; keep the document handler from seeing a detached target
  const mk = e.target.closest('.rv-mark');
  if (mk) return toggleMark(mk);
  if (e.target.closest('[data-modal]')) { closeMenu(); setExpanded(false); return openModal(); }
  const tile = e.target.closest('[data-tile]');
  if (tile) {
    clearTimeout(openTimer);
    const inner = e.target.closest('[data-href]');
    if (!state.expanded) return setExpanded(true);
    if (inner && inner !== tile && tile.contains(inner)) return go(inner);
    return setExpanded(false);
  }
  if (e.target.closest('[data-collapse]')) return setExpanded(false);
  const f = e.target.closest('[data-fly]');
  if (f) { if (state.fly === f.dataset.fly) return go(f); return setFly(f.dataset.fly); }
  const m = e.target.closest('[data-menu]');
  if (m) {
    clearTimeout(openTimer);
    if (menuHover(m)) return go(m);                         // hover opens, click goes to the hub page
    if (state.open === m.dataset.menu) closeMenu(); else openMenu(m.dataset.menu, m);
    return;
  }
  const a = e.target.closest('[data-href]');
  if (a) go(a);
});

function setVersion(ver, variation) {
  if (!VERSIONS[ver]) return;
  state.ver = ver; state.combo = VERSIONS[ver][variation] ? +variation : 1; state.fly = 'solutions';
  navigate('/', 'Commerce');   // version / variation change always restarts on the Commerce nav
}
document.addEventListener('change', e => { if (e.target.matches('[data-ver]')) setVersion(e.target.value, 1); });

document.addEventListener('click', e => {
  if (site.contains(e.target)) return;
  const mk = e.target.closest('.rv-mark');
  if (mk) return toggleMark(mk);
  if (e.target.closest('.rv-pop')) return;
  if (e.target.closest('#proto, #rvlegend')) {           // prototype chrome: never closes the menu you're inspecting
    const cb = e.target.closest('[data-combo]'), rv = e.target.closest('[data-review]');
    if (cb) setVersion(state.ver, cb.dataset.combo);
    if (rv) { state.review = !state.review; renderProto(); applyFlags(); }
    return;
  }
  if (modal.contains(e.target)) {                        // modal items navigate; anything else inside is handled by the modal itself
    const a = e.target.closest('[data-href]');
    if (a) go(a);
    return;
  }
  const pb = e.target.closest('[data-page]'), nv = e.target.closest('[data-nav]');
  if (pb) { navigate(BRAND[pb.dataset.page].home, BRAND[pb.dataset.page].name); return; }
  if (nv) {
    if (nv.dataset.nav === 'back' && state.hist.length) { state.fwd.push({ url: state.url, title: state.title, desc: state.desc, brand: state.brand }); restore(state.hist.pop()); }
    if (nv.dataset.nav === 'fwd' && state.fwd.length) { state.hist.push({ url: state.url, title: state.title, desc: state.desc, brand: state.brand }); restore(state.fwd.pop()); }
    return;
  }
  const a = e.target.closest('[data-href]');
  if (a && !e.target.closest('.acp-root')) { go(a); return; }
  closeMenu(); setExpanded(false);
});
document.addEventListener('mouseover', e => {
  if (!(e.target instanceof Element)) return;
  const a = e.target.closest('[data-href]'), s = document.getElementById('status');
  if (!s) return;
  if (!a) { s.textContent = ''; return; }
  const h = a.dataset.href;
  s.textContent = /^https?:/.test(h) ? h : 'commerce.com' + h;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); setExpanded(false); closeModal(); hidePop(); } });

// Dual nav: collapse the parent strip after scrolling down past a threshold; re-open on a deliberate upward scroll.
// Direction + hysteresis + a short lock during the animation prevent the feedback loop (collapse shifts layout →
// scroll event → re-open → …) that made the header shake.
let lastY = window.scrollY, scrollLock = false;
function setCollapsed(x) {
  if (site.classList.contains('scrolled') === x) return;
  site.classList.toggle('scrolled', x);
  scrollLock = true;
  const lockY = window.scrollY;
  // When the animation finishes, settle on whatever direction the user moved in the meantime.
  setTimeout(() => { scrollLock = false; decide(window.scrollY - lockY); }, V.ddMs + 80);
}
function decide(dy) {
  const y = window.scrollY, collapsed = site.classList.contains('scrolled');
  if (!collapsed && dy > 0 && y > 80) setCollapsed(true);
  else if (collapsed && (dy < -6 || y < 10)) setCollapsed(false);
}
function checkScroll() {
  const y = window.scrollY, dy = y - lastY; lastY = y;
  if (!V.collapseOnScroll || !site.querySelector('.pbar-wrap')) { site.classList.remove('scrolled'); return; }
  if (scrollLock) return;
  decide(dy);
}
window.addEventListener('scroll', checkScroll, { passive: true });

readHash();
renderAll();
</script>

<script>
/* ═══════════ CONTROL PANEL — delete from here to ship ═══════════ */
function initControlPanel(schema, apply, opts) {
  var closeOnOutsideClick = !opts || opts.closeOnOutsideClick !== false;
  var defaults = {}, v = {};
  schema.forEach(function (c) { defaults[c.id] = c.value; v[c.id] = c.value; });

  var GEAR = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

  var root = document.createElement('div');
  root.className = 'acp-root';
  document.body.appendChild(root);

  var tab = document.createElement('button');
  tab.className = 'acp-tab';
  tab.setAttribute('aria-label', 'Open controls');
  tab.innerHTML = GEAR + '<span class="acp-badge" style="display:none"></span>';
  root.appendChild(tab);

  var panel = document.createElement('aside');
  panel.className = 'acp-panel';
  panel.innerHTML =
    '<div class="acp-head"><div style="display:flex;align-items:center">' +
      '<h2 class="acp-title">Controls</h2><span class="acp-count"></span></div>' +
      '<button class="acp-x" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
    '</div><div class="acp-body"></div>' +
    '<div class="acp-foot"><button class="acp-copy" disabled>No changes yet</button>' +
      '<button class="acp-resetall" disabled>Reset all</button></div>';
  root.appendChild(panel);

  var body = panel.querySelector('.acp-body');
  var countEl = panel.querySelector('.acp-count');
  var copyBtn = panel.querySelector('.acp-copy');
  var resetAllBtn = panel.querySelector('.acp-resetall');
  var badge = tab.querySelector('.acp-badge');
  var refs = {};

  // Build rows, grouped
  var groups = [];
  schema.forEach(function (c) {
    var g = c.group || 'Controls';
    if (groups.indexOf(g) === -1) groups.push(g);
  });

  groups.forEach(function (g) {
    var sec = document.createElement('section');
    sec.className = 'acp-group';
    sec.innerHTML = '<h3 class="acp-glabel">' + g + '<span class="acp-dot"></span></h3>';
    var gdot = sec.querySelector('.acp-dot');

    schema.filter(function (c) { return (c.group || 'Controls') === g; }).forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'acp-row';
      row.innerHTML = '<div class="acp-rlabel"><span></span><span class="acp-dot"></span>' +
        '<button class="acp-reset">reset</button></div>';
      row.querySelector('.acp-rlabel span').textContent = c.label;
      var dot = row.querySelector('.acp-dot');
      var resetBtn = row.querySelector('.acp-reset');
      var control = buildField(c);
      row.appendChild(control.el);
      resetBtn.addEventListener('click', function () { control.setValue(defaults[c.id]); update(c.id, defaults[c.id]); });
      refs[c.id] = { dot: dot, reset: resetBtn, gdot: gdot, group: g, control: control };
      sec.appendChild(row);
    });
    body.appendChild(sec);
  });

  function buildField(c) {
    var el, setValue, node;
    function emit(val) { update(c.id, val); }

    if (c.type === 'textarea') {
      node = document.createElement('textarea');
      node.className = 'acp-input'; node.rows = 3; node.value = c.value;
      node.addEventListener('input', function () { emit(node.value); });
      el = node; setValue = function (x) { node.value = x; };

    } else if (c.type === 'range') {
      el = document.createElement('div'); el.className = 'acp-inline';
      node = document.createElement('input');
      node.type = 'range'; node.className = 'acp-input';
      node.min = c.min; node.max = c.max; node.step = c.step; node.value = c.value;
      var out = document.createElement('span');
      out.className = 'acp-num'; out.textContent = c.value + (c.unit || '');
      node.addEventListener('input', function () {
        out.textContent = node.value + (c.unit || '');
        emit(Number(node.value));
      });
      el.appendChild(node); el.appendChild(out);
      setValue = function (x) { node.value = x; out.textContent = x + (c.unit || ''); };

    } else if (c.type === 'color') {
      el = document.createElement('div'); el.className = 'acp-inline';
      node = document.createElement('input');
      node.type = 'color'; node.className = 'acp-input'; node.value = c.value;
      var hex = document.createElement('input');
      hex.type = 'text'; hex.className = 'acp-input'; hex.value = c.value;
      node.addEventListener('input', function () { hex.value = node.value; emit(node.value); });
      hex.addEventListener('input', function () {
        if (/^#[0-9a-f]{6}$/i.test(hex.value)) { node.value = hex.value; emit(hex.value); }
      });
      el.appendChild(node); el.appendChild(hex);
      setValue = function (x) { node.value = x; hex.value = x; };

    } else if (c.type === 'toggle') {
      node = document.createElement('button');
      node.type = 'button'; node.className = 'acp-toggle' + (c.value ? ' on' : '');
      node.setAttribute('role', 'switch');
      node.innerHTML = '<span class="acp-knob"></span>';
      node.addEventListener('click', function () {
        var next = !node.classList.contains('on');
        node.classList.toggle('on', next); emit(next);
      });
      el = node; setValue = function (x) { node.classList.toggle('on', !!x); };

    } else if (c.type === 'select') {
      node = document.createElement('select');
      node.className = 'acp-input';
      c.options.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = typeof o === 'string' ? o : o.value;
        opt.textContent = typeof o === 'string' ? o : o.label;
        node.appendChild(opt);
      });
      node.value = c.value;
      node.addEventListener('change', function () { emit(node.value); });
      el = node; setValue = function (x) { node.value = x; };

    } else {
      node = document.createElement('input');
      node.type = c.type === 'number' ? 'number' : 'text';
      node.className = 'acp-input'; node.value = c.value;
      if (c.type === 'number') { node.min = c.min; node.max = c.max; node.step = c.step; }
      node.addEventListener('input', function () {
        emit(c.type === 'number' ? Number(node.value) : node.value);
      });
      el = node; setValue = function (x) { node.value = x; };
    }
    return { el: el, setValue: setValue };
  }

  function changedIds() {
    return schema.filter(function (c) { return v[c.id] !== defaults[c.id]; }).map(function (c) { return c.id; });
  }

  function update(id, val) {
    v[id] = val;
    apply(v);
    var changed = changedIds();
    schema.forEach(function (c) {
      var on = changed.indexOf(c.id) !== -1;
      refs[c.id].dot.classList.toggle('on', on);
      refs[c.id].reset.classList.toggle('on', on);
    });
    groups.forEach(function (g) {
      var any = schema.some(function (c) {
        return (c.group || 'Controls') === g && changed.indexOf(c.id) !== -1;
      });
      var one = schema.filter(function (c) { return (c.group || 'Controls') === g; })[0];
      refs[one.id].gdot.classList.toggle('on', any);
    });
    var n = changed.length;
    countEl.textContent = n ? n + ' changed' : '';
    badge.textContent = n;
    badge.style.display = n && !panel.classList.contains('is-open') ? 'flex' : 'none';
    copyBtn.disabled = resetAllBtn.disabled = n === 0;
    copyBtn.textContent = n === 0 ? 'No changes yet' : 'Copy ' + n + ' change' + (n === 1 ? '' : 's');
  }

  function fmt(c, val) {
    if (c.type === 'toggle') return val ? 'on' : 'off';
    if (c.type === 'text' || c.type === 'textarea') return '"' + val + '"';
    if (c.type === 'range' || c.type === 'number') return val + (c.unit || '');
    if (c.type === 'select' && c.options) {
      for (var i = 0; i < c.options.length; i++) {
        var o = c.options[i];
        if (typeof o !== 'string' && o.value === val) return o.label;
      }
    }
    return String(val);
  }

  function report() {
    var lines = changedIds().map(function (id) {
      var c = schema.filter(function (x) { return x.id === id; })[0];
      return '- ' + c.label + ': ' + fmt(c, defaults[id]) + ' → ' + fmt(c, v[id]);
    });
    return 'Update the artifact with these control panel changes:\n\n' + lines.join('\n') +
      '\n\nApply these as the new default values in the CONTROLS config block.';
  }

  copyBtn.addEventListener('click', function () {
    var text = report();
    var done = function () {
      var prev = copyBtn.textContent;
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = prev; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(text, done); });
    } else { fallback(text, done); }
  });

  function fallback(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { if (document.execCommand('copy')) done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  resetAllBtn.addEventListener('click', function () {
    schema.forEach(function (c) { refs[c.id].control.setValue(defaults[c.id]); v[c.id] = defaults[c.id]; });
    update(schema[0].id, defaults[schema[0].id]);
  });

  function setOpen(open) {
    panel.classList.toggle('is-open', open);
    tab.classList.toggle('is-open', open);
    tab.setAttribute('aria-label', open ? 'Close controls' : 'Open controls');
    badge.style.display = !open && changedIds().length ? 'flex' : 'none';
  }
  tab.addEventListener('click', function () { setOpen(!panel.classList.contains('is-open')); });
  panel.querySelector('.acp-x').addEventListener('click', function () { setOpen(false); });
  document.addEventListener('mousedown', function (e) {
    if (!closeOnOutsideClick) return;
    if (!panel.classList.contains('is-open')) return;
    if (panel.contains(e.target) || tab.contains(e.target)) return;
    setOpen(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

  apply(v);
  return { get values() { return v; } };
}
